<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Surprise ✨</title>


    <!-- Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="homepage.css">

</head>

<body>

    <div class="ambient ambient-1">✦</div>
    <div class="ambient ambient-2">✧</div>
    <div class="ambient ambient-3">˚</div>
    <div class="ambient ambient-4">✦</div>
    <div class="ambient ambient-5">˚</div>
    <div class="ambient ambient-6">✧</div>

    <div class="home-container">

        <div class="top-label">
            ✦ A LITTLE SOMETHING FOR YOU ✦
        </div>

        <div class="ornament">
            ────── ❦ ──────
        </div>

        <h1>
            Okayyy Madam Jiiii,<br>
            <span>your surprise awaits...</span> ✦
        </h1>

        <p class="home-subtitle">
            A little something made just for you ♡
        </p>


        <div class="button-grid">

            <button onclick="openReasons()">
                <span class="button-icon">💌</span>
                <span class="button-text">
                    <strong>1000 Reasons</strong>
                    <small>why you're so special</small>
                </span>
                <span class="button-arrow">↗</span>
            </button>


            

            <button onclick="openSurprises()">
                <span class="button-icon">🎀</span>
                <span class="button-text">
                    <strong>Cute Surprises</strong>
                    <small>little things to discover</small>
                </span>
                <span class="button-arrow">↗</span>
            </button>


            <button onclick="exitPage()">
                <span class="button-icon">✦</span>
                <span class="button-text">
                    <strong>Exit</strong>
                    <small>leave the little world</small>
                </span>
                <span class="button-arrow">↗</span>
            </button>

        </div>

        <div class="bottom-note">
            made with a little too much love ♡
        </div>

    </div>

    <script src="homepage.js"></script>

</body>


</html>
