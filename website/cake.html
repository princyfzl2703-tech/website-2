<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Cake</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="cake.css">

</head>

<body>

<div class="background"></div>

<div class="sparkles"></div>

<div class="container">

    <p class="subtitle">
        Make a birthday wish...
    </p>

    <h1>
        Happy Birthday
    </h1>

    <div class="cake-wrapper">

        <!-- ================= TOP TIER ================= -->

        <div class="top-tier">

            <div class="frosting">

                <!-- Candles (These are INSIDE the frosting now) -->

                <div class="candles">

    <div class="candle"><div class="flame"></div></div>
    <div class="candle"><div class="flame"></div></div>
    <div class="candle"><div class="flame"></div></div>
    <div class="candle"><div class="flame"></div></div>
    <div class="candle"><div class="flame"></div></div>

</div>

                <!-- Cherries -->

                <div class="cherries">

                    <div class="cherry"></div>
                    <div class="cherry"></div>
                    <div class="cherry"></div>

                </div>

            </div>

            <div class="cake-body"></div>

        </div>

        <!-- ================= BOTTOM TIER ================= -->

        <div class="bottom-tier">

            <div class="frosting"></div>

            <div class="cake-body"></div>

        </div>

        <!-- Cake Stand -->

        <div class="cake-stand"></div>

    </div>

    <p class="instruction">
        Blow out the candles to continue
    </p>

    <button id="blowButton">

        ✨ Blow the Candles ✨

    </button>

    <p id="message"></p>

</div>

<script src="cake.js"></script>

</body>

</html>
